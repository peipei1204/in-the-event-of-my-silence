<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>In the Event of My Silence</title>
  <style>
    :root {color-scheme:dark; --ink:#e8e5df; --soft:#a8a49f;}
    * {box-sizing:border-box;}
    html {background:#101113;}
    body {margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse 75% 45% at 70% 8%,rgba(140,143,148,.10),transparent 70%),linear-gradient(140deg,#151719,#0c0d0f 65%,#161719);-webkit-font-smoothing:antialiased;}
    main {max-width:860px;margin:0 auto;padding:clamp(78px,13vh,140px) 26px 110px;text-align:center;}
    .eyebrow,.caption {font:11px/1.8 system-ui,-apple-system,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#928d88;}
    .eyebrow {margin:0 0 37px;}
    h1 {font-size:clamp(28px,4.2vw,44px);line-height:1.17;font-weight:400;letter-spacing:-.02em;margin:0 0 23px;}
    .subtitle {max-width:560px;margin:0 auto;color:var(--soft);font-size:clamp(15px,2.1vw,18px);font-style:italic;line-height:1.8;}
    .rule {width:40px;height:1px;background:#686766;margin:52px auto 56px;}
    figure {margin:0;}
    figure img {display:block;width:100%;height:auto;object-fit:contain;}
    figcaption {margin-top:21px;}
    blockquote {max-width:670px;margin:70px auto 0;font-size:clamp(19px,2.8vw,26px);line-height:1.85;font-style:italic;letter-spacing:.005em;}
    @media(max-width:600px){main{padding:76px 20px 78px}.eyebrow{font-size:10px;letter-spacing:.18em}.rule{margin:38px auto 42px}blockquote{margin-top:50px;}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal Archive · October 27, 2026</p>
    <h1>In the Event of My Silence</h1>
    <p class="subtitle">On trust, autonomy, and the person I would choose to speak for me.</p>
    <div class="rule" aria-hidden="true"></div>
    <figure>
      <img src="In the Event of My Silence.jpeg" alt="An original photograph of a healthcare power of attorney form resting on a wooden table">
      <figcaption class="caption">Health Care Proxy</figcaption>
    </figure>
    <blockquote>I figured it was only fair to give you the final say for once. Consider it your long-overdue opportunity for revenge — with my life literally in your hands.</blockquote>
  </main>
</body>
</html>
